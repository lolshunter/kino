<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кинотеатр</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #070709;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .wrapper {
            width: 100%;
            max-width: 900px;
            padding: 10px;
        }

        .kinobox {
            width: 100%;
            background: #12131c;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .kinobox iframe {
            width: 100% !important;
            aspect-ratio: 16 / 9;
            max-height: 70vh;
            border: none !important;
            display: block;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="kinobox"></div>
    </div>

    <script src="https://fbphdplay.top/kinobox.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const filmId = urlParams.get('id');

        if (filmId) {
            kinobox('.kinobox', {
                baseUrl: 'https://fbphdplay.top/',
                search: { kinopoisk: filmId }
            });

            // Прямой JS-перехват элементов Kinobox для принудительной покраски
            setInterval(() => {
                const nav = document.querySelector('.kinobox_nav, [class*="nav"]');
                if (nav) {
                    nav.style.setProperty('background', '#161825', 'important');
                    nav.style.setProperty('padding', '8px', 'important');
                    nav.style.setProperty('display', 'flex', 'important');
                    nav.style.setProperty('flex-wrap', 'wrap', 'important');
                    nav.style.setProperty('gap', '6px', 'important');
                    nav.style.setProperty('justify-content', 'center', 'important');
                }

                const buttons = document.querySelectorAll('.kinobox button, .kinobox [class*="button"], .kinobox_nav *');
                buttons.forEach(btn => {
                    if (btn.tagName !== 'IFRAME') {
                        btn.style.setProperty('background', '#4f46e5', 'important'); // Фиолетово-синий
                        btn.style.setProperty('color', '#ffffff', 'important');
                        btn.style.setProperty('border', 'none', 'important');
                        btn.style.setProperty('border-radius', '8px', 'important');
                        btn.style.setProperty('padding', '6px 12px', 'important');
                        btn.style.setProperty('font-size', '12px', 'important');
                        btn.style.setProperty('font-weight', '600', 'important');
                        btn.style.setProperty('cursor', 'pointer', 'important');
                    }
                });
            }, 300);
        } else {
            document.querySelector('.kinobox').innerHTML = 
                '<h3 style="color: #ffffff; text-align: center; padding: 40px;">Фильм не найден</h3>';
        }
    </script>
</body>
</html>
