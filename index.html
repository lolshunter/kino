<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Кинотеатр</title>

    <!-- Шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #0b0c10;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Контейнер строго под размер экрана */
        .kinobox {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Окно плеера */
        iframe {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
            display: block;
        }

        /* --- КАСТОМИЗАЦИЯ МЕНЮ ОЗВУЧЕК И ПЛЕЕРОВ --- */
        
        /* Панель с кнопками Kinobox */
        .kinobox_nav, [class*="kinobox"] ul, [class*="kinobox"] div[class*="nav"] {
            background-color: #0b0c10 !important;
            padding: 8px 10px !important;
            gap: 6px !important;
        }

        /* Кнопки выбора плееров и озвучек */
        .kinobox_nav_button, [class*="kinobox_nav"] button, [class*="kinobox"] li {
            background: #161822 !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 10px !important;
            color: #c5c6c7 !important;
            font-size: 13px !important;
            font-weight: 500 !important;
            padding: 7px 14px !important;
            margin: 2px !important;
            transition: all 0.2s ease-in-out !important;
            cursor: pointer !important;
        }

        /* Активная / Нажатая кнопка */
        .kinobox_nav_button_active, .kinobox_nav_button:hover {
            background: #6366f1 !important;
            border-color: #6366f1 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35) !important;
        }
    </style>
</head>
<body>

    <div class="kinobox"></div>

    <script src="https://fbphdplay.top/kinobox.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const filmId = urlParams.get('id');

        if (filmId) {
            kinobox('.kinobox', {
                baseUrl: 'https://fbphdplay.top/',
                search: { kinopoisk: filmId }
            });
        } else {
            document.body.innerHTML = '<h3 style="color: #ffffff; text-align: center; margin-top: 50px; font-family: sans-serif;">Фильм не найден</h3>';
        }
    </script>
</body>
</html>
