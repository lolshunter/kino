<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Плеер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }
        .kinobox {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="kinobox"></div>

    <script src="https://fbphdplay.top/kinobox.js"></script>
    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const urlParams = new URLSearchParams(window.location.search);
        const filmId = urlParams.get('id');

        if (filmId) {
            kinobox('.kinobox', {
                baseUrl: 'https://fbphdplay.top/',
                search: { kinopoisk: filmId }
            });
        } else {
            document.body.innerHTML = '<h3 style="color: #ffffff; text-align: center; margin-top: 50px; font-family: sans-serif;">Фильм не найден</h3>';
        }
    </script>
</body>
</html>
