<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>СюшаЛэнд</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #070709;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .wrapper {
            width: 100%;
            max-width: 900px;
            max-height: 100vh;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .kinobox {
            width: 100%;
            background: #12131c;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
        }

        iframe {
            width: 100% !important;
            aspect-ratio: 16 / 9;
            max-height: 60vh;
            border: none !important;
            display: block;
        }

        /* --- СТИЛИ КНОПОК --- */
        .kinobox_nav, [class*="kinobox"] ul, [class*="kinobox"] div[class*="nav"] {
            background-color: #12131c !important;
            padding: 10px 12px !important;
            gap: 6px !important;
            display: flex !important;
            flex-wrap: wrap !important;
            justify-content: center !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
        }

        .kinobox_nav_button, [class*="kinobox_nav"] button, [class*="kinobox"] li {
            background: #161825 !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 10px !important;
            color: #c5c6c7 !important;
            font-size: 13px !important;
            font-weight: 500 !important;
            padding: 7px 14px !important;
            margin: 2px !important;
            transition: all 0.2s ease-in-out !important;
            cursor: pointer !important;
            list-style: none !important;
        }

        .kinobox_nav_button_active, [class*="kinobox"] li[class*="active"], .kinobox_nav_button:hover {
            background: #6366f1 !important;
            border-color: #6366f1 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35) !important;
        }

        /* --- КОТИК СВЕРХУ СЛЕВА --- */
        .cat-container {
            position: relative;
            align-self: flex-start;
            margin-bottom: 8px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .cat-img {
            width: 110px;
            height: 110px;
            cursor: pointer;
            object-fit: contain;
            
            /* Блокировка выделения и меню скачивания */
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
            
            transition: transform 0.12s ease-out;
        }

        /* Мягкое сплющивание при нажатии */
        .cat-img:active, .cat-img.squish {
            transform: scale(1.1, 0.9) translateY(4px);
        }

        /* Анимация летящих сердечек */
        .floating-heart {
            position: absolute;
            font-size: 22px;
            pointer-events: none;
            animation: floatUp 1.2s ease-out forwards;
            z-index: 99;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.6);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) scale(1.4);
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Котик расположен СВЕРХУ СЛЕВА над плеером -->
        <div class="cat-container">
            <img src="cat.png" alt="Cat" class="cat-img" id="cat" draggable="false">
        </div>

        <div class="kinobox"></div>
    </div>

    <script src="https://fbphdplay.top/kinobox.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const filmId = urlParams.get('id');

        if (filmId) {
            kinobox('.kinobox', {
                baseUrl: 'https://fbphdplay.top/',
                search: { kinopoisk: filmId }
            });
        } else {
            document.querySelector('.kinobox').innerHTML = 
                '<h3 style="color: #ffffff; text-align: center; padding: 40px; font-weight: 400;">Фильм не найден</h3>';
        }

        // --- ЛОГИКА КОТИКА И ПАСХАЛКИ ---
        const cat = document.getElementById('cat');
        let clickCount = 0;

        // Блокируем вызов контекстного меню долгим нажатием
        cat.addEventListener('contextmenu', (e) => e.preventDefault());

        cat.addEventListener('click', () => {
            clickCount++;

            cat.classList.add('squish');
            setTimeout(() => cat.classList.remove('squish'), 120);

            // На 5-й клик вылетают сердечки
            if (clickCount >= 5) {
                spawnHearts();
                clickCount = 0;
            }
        });

        function spawnHearts() {
            const container = document.querySelector('.cat-container');
            const heartCount = 12;

            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.classList.add('floating-heart');
                heart.innerText = '💖';

                const angle = (Math.PI * 2 / heartCount) * i;
                const dist = 70 + Math.random() * 40;
                const dx = Math.cos(angle) * dist + 'px';
                const dy = (Math.sin(angle) * dist - 30) + 'px';

                heart.style.setProperty('--dx', dx);
                heart.style.setProperty('--dy', dy);
                heart.style.left = '45px';
                heart.style.top = '35px';

                container.appendChild(heart);

                setTimeout(() => heart.remove(), 1200);
            }
        }
    </script>
</body>
</html>
