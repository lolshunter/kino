<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>СюшаСинема</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #070709;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .wrapper {
            width: 100%;
            max-width: 900px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- КОНТЕЙНЕР ПЛЕЕРА И КОТИКА --- */
        .kinobox-container {
            position: relative;
            width: 100%;
        }

        .kinobox {
            width: 100%;
            background: #12131c;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        iframe {
            width: 100% !important;
            aspect-ratio: 16 / 9;
            max-height: 60vh;
            border: none !important;
            display: block;
        }

        /* --- КНОПКИ ПЛЕЕРА --- */
        .kinobox_nav, [class*="kinobox"] ul, [class*="kinobox"] div[class*="nav"] {
            background-color: #12131c !important;
            padding: 10px 12px !important;
            gap: 6px !important;
            display: flex !important;
            flex-wrap: wrap !important;
            justify-content: flex-start !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
        }

        .kinobox_nav_button, [class*="kinobox_nav"] button, [class*="kinobox"] li {
            background: #161825 !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 10px !important;
            color: #c5c6c7 !important;
            font-size: 13px !important;
            font-weight: 500 !important;
            padding: 7px 14px !important;
            margin: 2px !important;
            transition: all 0.2s ease-in-out !important;
            cursor: pointer !important;
            list-style: none !important;
        }

        .kinobox_nav_button_active, [class*="kinobox"] li[class*="active"], .kinobox_nav_button:hover {
            background: #6366f1 !important;
            border-color: #6366f1 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35) !important;
        }

        /* --- КОТИК НА РАМКЕ --- */
        .cat-container {
            position: absolute;
            top: -53px;
            right: 20px;
            z-index: 10;
            pointer-events: auto;
        }

        .cat-img {
            width: 90px;
            height: auto;
            cursor: pointer;
            object-fit: contain;
            display: block;
            
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
            
            transition: transform 0.06s ease-out;
            will-change: transform;
        }

        .cat-img.squish {
            transform: scale(1.12, 0.88) translateY(3px);
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="kinobox-container">
            <!-- Плеер -->
            <div class="kinobox"></div>

            <!-- Котик -->
            <div class="cat-container">
                <img src="cat.png" alt="Cat" class="cat-img" id="cat" draggable="false">
            </div>
        </div>
    </div>

    <script src="https://fbphdplay.top/kinobox.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const filmId = urlParams.get('id');

        // Инициализация плеера
        if (filmId) {
            kinobox('.kinobox', {
                baseUrl: 'https://fbphdplay.top/',
                search: { kinopoisk: filmId }
            });
        } else {
            document.querySelector('.kinobox').innerHTML = 
                '<h3 style="color: #ffffff; text-align: center; padding: 40px; font-weight: 400;">Фильм не найден</h3>';
        }

        // Анимация при нажатии на котика
        const cat = document.getElementById('cat');
        cat.addEventListener('contextmenu', (e) => e.preventDefault());
        cat.addEventListener('pointerdown', () => {
            cat.classList.add('squish');
            setTimeout(() => cat.classList.remove('squish'), 60);
        });
    </script>
</body>
</html>
